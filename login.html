<!-- # SECCION DE INICIO DE SESION -->
<section>

<h2>Iniciar sesion</h2>

<p>
Ingresa al sistema de gestion contable Contabili.
</p>

</div>

<!-- # FORMULARIO DE INICIO DE SESION -->
<form action="dashboard.html" method="get">

<!-- # CAMPO DE USUARIO -->
<label for="usuario">
Usuario
</label>

<input
type="text"
id="usuario"
name="usuario"
placeholder="Ingrese su usuario"
required
>

<!-- # CAMPO DE CONTRASEÑA -->
<label for="password">
Contraseña
</label>

<input
type="password"
id="password"
name="password"
placeholder="Ingrese su contraseña"
required
>

<!-- # BOTON PARA INGRESAR -->
<button type="submit">
Ingresar al sistema
</button>

</form>

<!-- # ENLACE PARA CREAR UNA CUENTA -->
<p>
¿No tienes una cuenta?
</p>

<a href="registro.html">

</a>
